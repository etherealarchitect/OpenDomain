app = "opendomain-api"
primary_region = "syd"

[build]
  dockerfile = "infrastructure/docker/Dockerfile.backend.prod"

[env]
  EPP_SIMULATE = "true"
  PORT = "8000"
  ENVIRONMENT = "production"
  COOKIE_SECURE = "true"
  APP_URL = "https://opendomain-web.fly.dev"
  API_URL = "https://opendomain-api.fly.dev"
  CORS_ORIGINS = '["https://opendomain-web.fly.dev"]'

[deploy]
  release_command = "cd /app/backend && alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/docs"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
