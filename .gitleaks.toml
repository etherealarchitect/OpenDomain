# Gitleaks configuration for OpenDomain
# Version: 8.18
title = "OpenDomain Secret Detection"
version = "8.18"

# Global configuration
[[rules]]
id = "api-key"
description = "Generic API key"
regex = '''(?i)(api_?key|apikey|access_?token|secret)[^a-zA-Z0-9]*['"]?([a-zA-Z0-9_\-]{20,})['"]?'''
tags = ["key", "api", "token"]

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''(xox[pborsa]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-z0-9]{32})'''
tags = ["slack", "token"]

[[rules]]
id = "stripe-access-token"
description = "Stripe secret key"
regex = '''(sk_(test|live)_[a-zA-Z0-9]{24})|(rk_(test|live)_[a-zA-Z0-9]{24})'''
tags = ["stripe", "api"]

[[rules]]
id = "email-service-key"
description = "Email service API key"
regex = '''(?i)(resend|mailgun|sendgrid|postmark)[^a-zA-Z0-9]*['"]?([a-zA-Z0-9_\-]{20,})['"]?'''
file = '''(?i).*\.(env|toml|ini|cfg|yaml|yml|py|js|ts)'''
tags = ["email", "api"]

[allowlist.regexes]
patterns = [
  # Generic non-secret patterns
  "^TEST_KEY$",
  "^DEMO_KEY$",
  "^PLACEHOLDER$",
  "^EXAMPLE$",
  "[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{4}", # Generic card-like numbers
]

# Global configuration