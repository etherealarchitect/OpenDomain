# Development-only stack. It intentionally exposes local service ports and uses
# placeholder credentials. Do not deploy this file to the public internet.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opendomain
      POSTGRES_PASSWORD: opendomain
      POSTGRES_DB: opendomain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendomain"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

  powerdns:
    image: powerdns/pdns-auth-49:latest
    ports:
      - "5300:53/tcp"
      - "5300:53/udp"
      - "8081:8081"
    environment:
      PDNS_AUTH_API_KEY: change-me
      PDNS_AUTH_WEBSERVER: "yes"
      PDNS_AUTH_WEBSERVER_PORT: "8081"
      PDNS_AUTH_WEBSERVER_ADDRESS: "0.0.0.0"
      PDNS_AUTH_WEBSERVER_ALLOW_FROM: "0.0.0.0/0"
      PDNS_AUTH_LAUNCH: gpgsql
      PDNS_AUTH_GPGSQL_HOST: db
      PDNS_AUTH_GPGSQL_PORT: "5432"
      PDNS_AUTH_GPGSQL_USER: opendomain
      PDNS_AUTH_GPGSQL_PASSWORD: opendomain
      PDNS_AUTH_GPGSQL_DBNAME: opendomain
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
